# Detekt configuration — NewsApp
# Builds upon the default config (buildUponDefaultConfig = true in build.gradle.kts).
# Kept lenient for an early-stage codebase; tightened in later phases.

build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 4
  WildcardImport:
    active: false

naming:
  # Allow @Composable functions to be PascalCase
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  # Allow snake_case package segments (e.g. app_entry, news_navigator)
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
