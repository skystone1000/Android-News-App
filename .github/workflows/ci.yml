name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The Android project lives in the NewsApp/ subdirectory.
defaults:
  run:
    working-directory: NewsApp

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            NewsApp/app/build/reports/
            NewsApp/build/reports/
          retention-days: 7
